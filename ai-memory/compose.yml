name: ai-memory

services:
  ai-memory:
    image: akitaonrails/ai-memory:3.0.0
    container_name: ai-memory
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:49374:49374"
    environment:
      AI_MEMORY_ALLOWED_HOSTS: "localhost,127.0.0.1,::1,ai-memory"
      AI_MEMORY_PROFILE__ENABLED: "true"
    networks:
      - ai-memory
    healthcheck:
      test: ["CMD", "/usr/local/bin/ai-memory", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  ai-memory:
    name: ai-memory
